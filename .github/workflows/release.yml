name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest -m "not slow and not fuzz" --cov=aethel_codex --cov-branch -q
      - run: uv run pytest -m conformance -q
      - run: uv build
      - run: uv run twine check dist/*
      - run: uv run cyclonedx-py environment --output-reproducible -o dist/sbom.json
      - name: Generate Checksums
        run: |
          cd dist
          sha256sum $(ls -1 | grep -v SHA256SUMS) > SHA256SUMS
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
