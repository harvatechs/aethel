name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15ab33a325bd888a5022631ef955737b # v5.1.0
      - run: uv sync --all-groups
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest -m "not slow and not fuzz" --cov=aethel_codex --cov-branch -q
      - run: uv run pytest -m conformance -q
      - run: uv build
      - run: uv run twine check dist/*
      - name: Generate Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS
      - name: GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9ec8740b814d003ef82f9bc3 # v2.2.1
        with:
          files: |
            dist/*
