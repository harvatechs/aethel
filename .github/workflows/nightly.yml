name: nightly
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  nightly-fuzz-slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15ab33a325bd888a5022631ef955737b # v5.1.0
      - run: uv sync --all-groups
      - run: uv run pytest -m fuzz -q
      - run: uv run pytest -m slow -q
      - run: uv run pip-audit
