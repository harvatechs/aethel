name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15ab33a325bd888a5022631ef955737b # v5.1.0
      - run: uv sync --all-groups
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15ab33a325bd888a5022631ef955737b # v5.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-groups
      - run: uv run pytest -m "not slow and not fuzz" --cov=aethel_codex --cov-branch -q
      - run: uv run python tools/check_coverage.py
      - run: uv run python tools/trace.py
      - run: uv run pytest -m conformance -q

  determinism:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15ab33a325bd888a5022631ef955737b # v5.1.0
      - run: uv sync --all-groups
      - run: uv run python -c "print('Determinism step')"

  build-install-smoke:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@887a942a15ab33a325bd888a5022631ef955737b # v5.1.0
      - run: uv build && uv run twine check dist/*
