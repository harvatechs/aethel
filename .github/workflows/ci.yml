name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run pytest -m "not slow and not fuzz" --cov=aethel_codex --cov-branch --cov-report=json:coverage.json -q
      - run: uv run python tools/check_coverage.py
      - run: uv run python tools/trace.py
      - run: uv run pytest -m conformance -q

  determinism:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run python tools/determinism_check.py

  build-install-smoke:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv build && uv run twine check dist/*
      - run: uv run python tools/install_smoke.py
